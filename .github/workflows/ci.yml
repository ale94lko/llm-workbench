name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: License headers
        run: npm run check:headers

      - name: Typecheck
        run: npm run typecheck

  # First-class coverage gate (job id `test` for ci_runs_tests / status checks).
  # Coverage thresholds (vitest.config.ts): lines/functions/statements ≥90%, branches ≥80%.
  # Vitest exits non-zero if unmet → this job fails the workflow.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test with coverage
        run: npm run test:coverage

      # Prove the unit suite needs no live network / Ollama (Linux network namespace).
      - name: Offline unit proof
        run: npm run test:offline

  # Dedicated clean-runner gate: do NOT nest verify:fresh after quality/test npm ci.
  # The script itself runs npm ci → build → test:coverage and fails the job on error.
  fresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Fresh clone verify
        run: npm run verify:fresh

  # Documented Compose path: .env.example → .env, no Ollama profile, /api/health must respond.
  # Runs in parallel with quality/test/fresh (does not wait on them); still fails the workflow.
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build app image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          load: true
          tags: llm-workbench:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy env defaults
        run: cp .env.example .env

      - name: Start Compose
        run: docker compose up -d --no-build

      - name: Wait for /api/health
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            if curl -fsS http://localhost:3000/api/health; then
              echo
              curl -fsS -o /dev/null -w "GET / → %{http_code}\n" http://localhost:3000/
              exit 0
            fi
            echo "attempt ${i}/36: /api/health not ready yet"
            sleep 5
          done
          echo "::error::Compose /api/health did not become ready in time"
          docker compose ps
          docker compose logs
          exit 1

      - name: Tear down Compose
        if: always()
        run: docker compose down -v

  commitlint:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Lint commit messages
        # wagoid/commitlint-github-action@v6.2.1
        # configFile must be .mjs; allows Conventional types including `merge:`
        # for conflict-resolution commits on PR branches.
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed
        with:
          configFile: commitlint.config.mjs

  dco:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-dco.mjs

  # Static site for GitHub Pages. Only on main push; Deploy downloads this
  # artifact via workflow_run (no privileged checkout of head_sha).
  pages-artifact:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        run: npm run generate
        env:
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/

      - name: Disable Jekyll processing
        run: touch .output/public/.nojekyll

      - name: Upload pages site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-site
          path: .output/public
          if-no-files-found: error
          retention-days: 5
