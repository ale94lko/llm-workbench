# OpenSSF Scorecard: supply-chain checks.
# Do not add the README Scorecard badge until this workflow has succeeded on main.
# Do not run on pull_request. Do not upload SARIF to GitHub code scanning while
# CodeQL default setup is enabled (mixed advanced + default SARIF is rejected).
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '31 4 * * 2'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Uncomment for a fuller Branch-Protection score on this public repo:
          # repo_token: ${{ secrets.SCORECARD_TOKEN }}
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      # Do not upload Scorecard SARIF to GitHub code scanning while CodeQL
      # default setup is enabled — GitHub rejects mixed advanced + default SARIF.
