name: Dependency freshness

on:
  schedule:
    # Weekly Monday 08:00 UTC — distinct from Dependabot PRs
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outdated:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report npm outdated
        run: |
          set +e
          npm outdated --long --json > outdated.json 2> outdated-error.txt
          outdated_status=$?
          set -e

          if [ "$outdated_status" -ne 0 ] && [ ! -s outdated.json ]; then
            cat outdated-error.txt
            exit "$outdated_status"
          fi

          {
            echo '## npm outdated'
            echo
            echo 'TypeScript 7 is currently allowlisted because package.json pins the Nuxt toolchain to TypeScript 5.9.x; all other multi-major drift fails.'
            echo
            node scripts/check-dependency-drift.mjs outdated.json
          } | tee outdated-report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload outdated report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-outdated
          path: |
            outdated-report.txt
            outdated.json
            outdated-error.txt
          if-no-files-found: warn
          retention-days: 30
